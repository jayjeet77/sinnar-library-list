<form id="membershipForm">
    <div class="row g-3">
        <div class="col-12"><label class="form-label fw-bold">संपूर्ण नाव *</label>
            <input type="text" id="m_name" class="form-control" required placeholder="नाव आडनाव"></div>
        
        <div class="col-md-6"><label class="form-label fw-bold">मोबाईल (१० अंकी) *</label>
            <input type="tel" id="m_mobile" class="form-control" required pattern="[0-9]{10}" title="कृपया १० अंकी मोबाईल नंबर टाका"></div>
        
        <div class="col-md-6"><label class="form-label fw-bold">ईमेल आयडी *</label>
            <input type="email" id="m_email" class="form-control" required placeholder="example@mail.com"></div>
        
        <div class="col-md-6"><label class="form-label fw-bold">आधार क्रमांक (१२ अंकी) *</label>
            <input type="text" id="m_aadhaar" class="form-control" required pattern="[0-9]{12}" title="कृपया १२ अंकी आधार नंबर टाका"></div>
            
        <div class="col-md-6"><label class="form-label fw-bold">वय</label>
            <input type="number" id="m_age" class="form-control" required></div>

        <div class="col-12"><label class="form-label fw-bold">सध्याचा पत्ता (पिनकोडसह) *</label>
            <textarea id="m_address" class="form-control" rows="2" required placeholder="घर क्र, गल्ली, पिनकोडसह पत्ता"></textarea></div>

        <div class="col-12">
            <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="sameAddress" onclick="copyAddress()">
                <label class="form-check-label small" for="sameAddress">सध्याचा पत्ता आणि कायमचा पत्ता एकच आहे</label>
            </div>
            <label class="form-label fw-bold">कायमचा पत्ता *</label>
            <textarea id="m_perm_address" class="form-control" rows="2" required></textarea>
        </div>

        <div class="col-12"><label class="form-label fw-bold">निवडलेला वर्ग</label>
            <select id="m_class" class="form-select">
                <option value="वर्ग १">वर्ग १ (१ पुस्तक)</option>
                <option value="वर्ग २">वर्ग २ (२ पुस्तके)</option>
            </select>
        </div>
    </div>
    <div class="mt-4 text-center">
        <button type="submit" id="submitBtn" class="btn btn-success btn-lg px-5 fw-bold">अर्ज सादर करा</button>
    </div>
</form>

<script>
// पत्ता कॉपी करण्यासाठीचे फंक्शन
function copyAddress() {
    if(document.getElementById('sameAddress').checked) {
        document.getElementById('m_perm_address').value = document.getElementById('m_address').value;
    } else {
        document.getElementById('m_perm_address').value = "";
    }
}

// Apps Script ला पाठवताना नवीन रकाने जोडणे
const payload = {
    name: document.getElementById('m_name').value,
    mobile: document.getElementById('m_mobile').value,
    email: document.getElementById('m_email').value, // नवीन
    aadhaar: document.getElementById('m_aadhaar').value,
    address: document.getElementById('m_address').value,
    perm_address: document.getElementById('m_perm_address').value, // नवीन
    age: document.getElementById('m_age').value,
    class_choice: document.getElementById('m_class').value
};
</script>
