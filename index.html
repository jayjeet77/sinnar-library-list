<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>सिन्नर सार्वजनिक वाचनालय - डिजिटल सूची</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f6f2e9;
            --title-color: #9d4d27;
            --accent-color: #C5884B;
            --footer-bg: #494C3B;
            --border-color: #CBCBBF;
            --tag-color: #9F9B8A;
            --focus-color: #9f9bba;
        }

        body { background-color: var(--bg-color); font-family: 'Segoe UI', Arial, sans-serif; color: #333; }
        
        .header-section { background: #ffffff; padding: 30px 15px; text-align: center; border-bottom: 6px solid var(--accent-color); }
        .header-section h2 { color: var(--title-color); font-weight: bold; margin-bottom: 10px; }
        
        /* विभागवार पट्टी (Menu Bar) */
        .category-nav { background: var(--footer-bg); overflow-x: auto; white-space: nowrap; padding: 12px; position: sticky; top: 0; z-index: 1050; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .category-nav a { color: #f6f2e9; text-decoration: none; padding: 6px 18px; margin: 0 5px; border-radius: 20px; font-size: 0.9em; border: 1px solid rgba(255,255,255,0.2); transition: 0.3s; display: inline-block; }
        .category-nav a:hover, .category-nav a.active { background: var(--accent-color); border-color: var(--accent-color); color: white; }

        /* Search Section */
        .search-container { padding: 25px 0; background: var(--bg-color); }
        .search-box-group { max-width: 900px; margin: 0 auto; display: flex; gap: 12px; flex-wrap: wrap; padding: 0 15px; }
        .search-input { flex: 2; min-width: 250px; border: 2px solid var(--border-color); border-radius: 8px; }
        .filter-select { flex: 1; min-width: 150px; border: 2px solid var(--border-color); border-radius: 8px; cursor: pointer; }
        .form-control:focus, .form-select:focus { border-color: var(--focus-color); box-shadow: 0 0 0 0.25rem rgba(159, 155, 186, 0.25); }

        /* Book Cards */
        .book-card { background: #ffffff; border-radius: 10px; padding: 18px; margin-bottom: 15px; border-left: 8px solid var(--accent-color); border-right: 1px solid var(--border-color); border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); box-shadow: 0 4px 6px rgba(0,0,0,0.03); transition: transform 0.2s; }
        .book-card:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.06); }
        .sno-badge { background: var(--accent-color); color: #ffffff; min-width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: bold; margin-right: 18px; font-size: 0.9em; flex-shrink: 0; }
        .category-tag { font-size: 0.75rem; background: var(--tag-color); color: #ffffff; padding: 4px 12px; border-radius: 15px; font-weight: bold; }
        .book-title { color: var(--title-color) !important; font-weight: bold; font-size: 1.1rem; }

        /* Pagination Buttons */
        .pagination-container { display: flex; justify-content: center; gap: 20px; margin: 40px 0; align-items: center; }
        .btn-page { background: var(--title-color); color: white; border: none; padding: 10px 25px; border-radius: 6px; font-weight: bold; transition: 0.3s; }
        .btn-page:hover:not(:disabled) { background: var(--accent-color); }
        .btn-page:disabled { background: #ccc; cursor: not-allowed; }

        .footer { text-align: center; padding: 35px; background: var(--footer-bg); color: #f6f2e9; margin-top: 60px; border-top: 5px solid var(--accent-color); }
    </style>
</head>
<body>

<div class="header-section">
    <img src="logo.png" class="logo-img" alt="Library Logo" style="max-width: 150px; margin-bottom: 15px;">
    
    <h2> सिन्नर सार्वजनिक वाचनालय </h2>
<p class="mb-0 text-muted">डिजिटल ग्रंथसूची </p>
    <p class="mb-0 text-muted">संकलन आणि सूचिकरण : जितेंद्र जगताप</p>
</div>

<div class="category-nav text-center" id="topCategoryNav">
    <a href="#" class="active" onclick="filterByCategory('All', this)">सर्व पुस्तके</a>
    <a href="#" onclick="filterByCategory('कादंबरी', this)">कादंबरी</a>
    <a href="#" onclick="filterByCategory('कथा', this)">कथा</a>
    <a href="#" onclick="filterByCategory('कविता', this)">कविता</a>
    <a href="#" onclick="filterByCategory('चरित्र', this)">चरित्र</a>
    <a href="#" onclick="filterByCategory('धार्मिक', this)">धार्मिक</a>
</div>

<div class="container search-container">
    <div class="search-box-group">
        <input type="text" id="searchInput" class="form-control form-control-lg search-input" placeholder="पुस्तकाचे नाव किंवा लेखक शोधा...">
        <select id="categoryFilter" class="form-select form-select-lg filter-select">
            <option value="All">सर्व विभाग</option>
        </select>
    </div>
    <div class="text-center mt-3 results-info">
        एकूण निकाल: <span id="totalMatches" class="fw-bold">0</span> | पान: <span id="currentPageNum" class="fw-bold">1</span>
    </div>
</div>

<div class="container">
    <div id="bookList">
        <div class="text-center p-5">माहिती लोड होत आहे, कृपया प्रतीक्षा करा...</div>
    </div>

    <div class="pagination-container" id="paginationRow" style="display: none;">
        <button id="prevBtn" class="btn-page" onclick="changePage(-1)">मागे</button>
        <span id="pageIndicator" class="fw-bold">1 / 1</span>
        <button id="nextBtn" class="btn-page" onclick="changePage(1)">पुढचे</button>
    </div>
</div>

<div class="footer">
    <h5>सिन्नर सार्वजनिक वाचनालय, सिन्नर</h5>
    <p class="small mb-0">डिजिटल ग्रंथसूची पोर्टल</p>
</div>

<script>
    // तुमची Google Sheet लिंक (CSV Export)
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/1zskDx0OIbMyzY5Sj_7GBS1iokrZY_5KnPn9jsW3dDNc/gviz/tq?tqx=out:csv';

    let allBooks = [];
    let filteredBooks = [];
    let currentPage = 1;
    const pageSize = 50;

    async function fetchData() {
        try {
            const response = await fetch(sheetUrl);
            const data = await response.text();
            
            // CSV Parsing (Simple)
            const rows = data.split('\n').slice(1);
            allBooks = rows.map(row => {
                const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                return {
                    "SNo": cols[0]?.replace(/"/g, '').trim(),
                    "Class": cols[1]?.replace(/"/g, '').trim(),
                    "Name": cols[2]?.replace(/"/g, '').trim(),
                    "Author": cols[3]?.replace(/"/g, '').trim(),
                    "Pub": cols[4]?.replace(/"/g, '').trim()
                };
            }).filter(b => b.Name);

            setupCategoryDropdown();
            applyFilters();
        } catch (error) {
            document.getElementById('bookList').innerHTML = "माहिती लोड करताना त्रुटी आली. कृपया इंटरनेट तपासा.";
        }
    }

    function setupCategoryDropdown() {
        const select = document.getElementById('categoryFilter');
        const categories = [...new Set(allBooks.map(b => b.Class))].sort();
        categories.forEach(cat => {
            if(cat) {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.innerText = cat;
                select.appendChild(opt);
            }
        });
    }

    function applyFilters() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const selectedCat = document.getElementById('categoryFilter').value;

        filteredBooks = allBooks.filter(book => {
            const matchesSearch = (book.Name?.toLowerCase().includes(searchTerm) || 
                                 book.Author?.toLowerCase().includes(searchTerm) ||
                                 book.SNo?.toString().includes(searchTerm));
            const matchesCat = (selectedCat === "All" || book.Class === selectedCat);
            return matchesSearch && matchesCat;
        });

        currentPage = 1;
        renderPage();
    }

    function renderPage() {
        const bookList = document.getElementById('bookList');
        bookList.innerHTML = '';

        const start = (currentPage - 1) * pageSize;
        const end = start + pageSize;
        const paginatedItems = filteredBooks.slice(start, end);
        const totalPages = Math.ceil(filteredBooks.length / pageSize) || 1;

        document.getElementById('totalMatches').innerText = filteredBooks.length.toLocaleString();
        document.getElementById('currentPageNum').innerText = currentPage;
        document.getElementById('pageIndicator').innerText = `${currentPage} / ${totalPages}`;
        
        document.getElementById('paginationRow').style.display = filteredBooks.length > pageSize ? 'flex' : 'none';
        document.getElementById('prevBtn').disabled = currentPage === 1;
        document.getElementById('nextBtn').disabled = currentPage === totalPages;

        if (paginatedItems.length === 0) {
            bookList.innerHTML = '<div class="alert alert-light text-center border p-5">माहिती सापडली नाही. कृपया दुसरे शब्द वापरून पहा.</div>';
            return;
        }

        paginatedItems.forEach(book => {
            const div = document.createElement('div');
            div.className = 'book-card d-flex align-items-center';
            div.innerHTML = `
                <div class="sno-badge">${book.SNo || '-'}</div>
                <div class="flex-grow-1">
                    <div class="d-flex justify-content-between align-items-start mb-1">
                        <h6 class="book-title mb-0">${book.Name}</h6>
                        <span class="category-tag">${book.Class}</span>
                    </div>
                    <div class="small text-muted">लेखक: ${book.Author || 'उपलब्ध नाही'} | प्रकाशन: ${book.Pub || '-'}</div>
                </div>
            `;
            bookList.appendChild(div);
        });
    }

    function changePage(step) {
        currentPage += step;
        renderPage();
        window.scrollTo(0, 0);
    }

    function filterByCategory(cat, element) {
        document.getElementById('categoryFilter').value = cat;
        // Update active menu link
        document.querySelectorAll('.category-nav a').forEach(a => a.classList.remove('active'));
        if(element) element.classList.add('active');
        applyFilters();
    }

    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('categoryFilter').addEventListener('change', (e) => {
        applyFilters();
        // Sync top nav
        document.querySelectorAll('.category-nav a').forEach(a => {
            a.classList.toggle('active', a.innerText === e.target.value || (e.target.value === 'All' && a.innerText === 'सर्व पुस्तके'));
        });
    });

    fetchData();
</script>

</body>
</html>
